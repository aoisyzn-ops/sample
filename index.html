<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミニゲームランド</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(#ffd97d 0%, #ffe9a8 100%);
  }
  #menu {
    max-width: 480px;
    margin: 0 auto;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
    padding: 24px;
  }
  h1 {
    font-size: 30px; color: #7a4a00;
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
    margin-bottom: 8px;
  }
  a.game {
    display: flex; align-items: center; gap: 16px;
    width: 100%;
    background: #fff;
    border-radius: 20px;
    padding: 18px 22px;
    text-decoration: none;
    box-shadow: 0 5px 0 rgba(0,0,0,0.12);
  }
  a.game:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  a.game .icon { font-size: 44px; }
  a.game .name { font-size: 20px; font-weight: bold; color: #444; }
  a.game .desc { font-size: 13px; color: #999; margin-top: 2px; }
</style>
</head>
<body>
<div id="menu">
  <h1>🎮 ミニゲームランド</h1>
  <a class="game" href="./suika.html">
    <span class="icon">🍉</span>
    <span>
      <div class="name">スイカゲーム</div>
      <div class="desc">フルーツを合体させてスイカを作ろう</div>
    </span>
  </a>
  <a class="game" href="./tomodachi.html">
    <span class="icon">🏠</span>
    <span>
      <div class="name">ともだちコレクション</div>
      <div class="desc">ともだちを作ってお世話しよう</div>
    </span>
  </a>
  <a class="game" href="./kart.html">
    <span class="icon">🏁</span>
    <span>
      <div class="name">えもじカート</div>
      <div class="desc">アイテムを使ってレースで1位をめざせ</div>
    </span>
  </a>
  <a class="game" href="./rpg.html">
    <span class="icon">🔮</span>
    <span>
      <div class="name">クリスタルの伝説</div>
      <div class="desc">ドット絵の世界を冒険するミニRPG</div>
    </span>
  </a>
</div>
</body>
</html>
