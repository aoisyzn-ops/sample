<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えもじカート 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #87ceeb;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---- HUD ---- */
  .hud { position: absolute; color: #fff; font-weight: bold; text-shadow: 0 2px 3px rgba(0,0,0,0.6); z-index: 5; pointer-events: none; }
  #hudLap   { top: 10px; left: 12px; font-size: 20px; }
  #hudRank  { top: 6px; right: 12px; font-size: 30px; }
  #hudTime  { top: 40px; left: 12px; font-size: 14px; opacity: 0.9; }
  #hudSpeed { top: 44px; right: 12px; font-size: 15px; }
  #hudMsg {
    top: 26%; left: 0; right: 0;
    text-align: center; font-size: 52px;
    text-shadow: 0 4px 8px rgba(0,0,0,0.5);
  }

  /* ---- 操作ボタン ---- */
  .ctl {
    position: absolute; bottom: 18px;
    width: 84px; height: 84px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.25);
    color: #fff; font-size: 34px;
    z-index: 6;
    backdrop-filter: blur(2px);
  }
  .ctl:active { background: rgba(255,255,255,0.5); }
  #btnL { left: 14px; }
  #btnR { right: 14px; }
  #btnItem {
    right: 14px; bottom: 118px;
    background: rgba(255,215,0,0.35);
    border: 3px solid rgba(255,255,255,0.6);
    font-size: 38px;
  }

  /* ---- オーバーレイ ---- */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(20, 30, 60, 0.88);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    z-index: 10;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 36px; text-shadow: 0 3px 0 rgba(0,0,0,0.4); }
  .overlay .sub { font-size: 14px; opacity: 0.85; }
  #charRow { display: flex; gap: 12px; }
  .charBtn {
    font-size: 40px;
    width: 70px; height: 70px;
    border-radius: 16px;
    border: 3px solid transparent;
    background: rgba(255,255,255,0.15);
  }
  .charBtn.sel { border-color: #ffd700; background: rgba(255,215,0,0.25); }
  .bigBtn {
    font-size: 22px; font-weight: bold;
    padding: 14px 48px;
    border: none; border-radius: 999px;
    background: #ff5252; color: #fff;
    box-shadow: 0 5px 0 #b73838;
  }
  .bigBtn:active { transform: translateY(3px); box-shadow: none; }
  #resultList {
    font-size: 18px; line-height: 1.9;
    background: rgba(0,0,0,0.3);
    border-radius: 14px;
    padding: 12px 28px;
    text-align: left;
  }
  #resultPlace { font-size: 44px; }
  .help { font-size: 13px; opacity: 0.8; line-height: 1.7; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div class="hud" id="hudLap">LAP 1/3</div>
  <div class="hud" id="hudRank">6位</div>
  <div class="hud" id="hudTime">0:00.0</div>
  <div class="hud" id="hudSpeed">0 km/h</div>
  <div class="hud" id="hudMsg"></div>

  <button class="ctl" id="btnL">◀</button>
  <button class="ctl" id="btnR">▶</button>
  <button class="ctl" id="btnItem">·</button>

  <div class="overlay show" id="titleOv">
    <h1>🏁 えもじカート 3D</h1>
    <div class="sub">マシンをえらんでね</div>
    <div id="charRow"></div>
    <button class="bigBtn" id="startBtn">スタート!</button>
    <div class="help">
      ◀ ▶ でハンドル(アクセルは自動)<br>
      ❓ボックスを取るとアイテムゲット!<br>
      🍄ダッシュ 🍌うしろに設置 🐢前に発射<br>
      3周してゴールをめざせ!
    </div>
  </div>

  <div class="overlay" id="resultOv">
    <h1>🏁 ゴール!</h1>
    <div id="resultPlace"></div>
    <div id="resultList"></div>
    <button class="bigBtn" id="retryBtn">もう一回</button>
  </div>
</div>

<script>
  // 3D読み込み失敗時の案内
  setTimeout(() => {
    if (!window.__kartBooted) {
      document.getElementById("hudMsg").textContent = "読み込み中…";
      setTimeout(() => {
        if (!window.__kartBooted)
          document.getElementById("hudMsg").innerHTML =
            "<span style='font-size:18px'>読み込みに失敗しました。<br>通信環境を確認して再読み込みしてね</span>";
      }, 6000);
    }
  }, 2500);
</script>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const randOf = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ================= 絵文字テクスチャ =================
const texCache = {};
function emojiTexture(emoji, size = 192) {
  if (texCache[emoji]) return texCache[emoji];
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.font = `${size * 0.8}px serif`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(emoji, size / 2, size / 2 + size * 0.05);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  texCache[emoji] = tex;
  return tex;
}
function makeSprite(emoji, w = 1.4) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTexture(emoji), transparent: true }));
  sp.scale.set(w, w, 1);
  return sp;
}

// ================= コース(閉じたサーキット) =================
const HALF_ROAD = 6;        // 道路の半分の幅(m)
const CTRL = [
  [0, 0], [90, -10], [160, 30], [185, 110], [120, 175],
  [35, 150], [-20, 205], [-110, 215], [-175, 140], [-155, 50], [-90, -22],
];
const curve = new THREE.CatmullRomCurve3(
  CTRL.map(([x, z]) => new THREE.Vector3(x, 0, z)), true, "centripetal");
const TRACK_LEN = curve.getLength();
const SAMP = 1500;
const rawPts = curve.getSpacedPoints(SAMP); // SAMP+1個(最後=最初)
// 各サンプルの位置・接線・法線(左向き)・符号つき曲率
const F = { px: [], pz: [], tx: [], tz: [], nx: [], nz: [], kn: [] };
{
  const ds = TRACK_LEN / SAMP;
  for (let i = 0; i < SAMP; i++) {
    const p = rawPts[i], q = rawPts[(i + 1) % SAMP];
    let tx = q.x - p.x, tz = q.z - p.z;
    const tl = Math.hypot(tx, tz) || 1;
    tx /= tl; tz /= tl;
    F.px.push(p.x); F.pz.push(p.z);
    F.tx.push(tx); F.tz.push(tz);
    F.nx.push(tz); F.nz.push(-tx); // 左向き法線
  }
  for (let i = 0; i < SAMP; i++) {
    const j = (i + 1) % SAMP;
    // 接線変化の法線方向成分 = 符号つき曲率
    const dtx = F.tx[j] - F.tx[i], dtz = F.tz[j] - F.tz[i];
    F.kn.push((dtx * F.nx[i] + dtz * F.nz[i]) / ds);
  }
  // 曲率をならす
  const sm = [];
  for (let i = 0; i < SAMP; i++) {
    let s = 0;
    for (let k = -4; k <= 4; k++) s += F.kn[((i + k) % SAMP + SAMP) % SAMP];
    sm.push(s / 9);
  }
  F.kn = sm;
}
function frameAt(s) {
  const u = (((s / TRACK_LEN) % 1 + 1) % 1) * SAMP;
  const i = Math.floor(u) % SAMP, j = (i + 1) % SAMP, t = u - Math.floor(u);
  return {
    px: lerp(F.px[i], F.px[j], t), pz: lerp(F.pz[i], F.pz[j], t),
    tx: lerp(F.tx[i], F.tx[j], t), tz: lerp(F.tz[i], F.tz[j], t),
    nx: lerp(F.nx[i], F.nx[j], t), nz: lerp(F.nz[i], F.nz[j], t),
    kn: lerp(F.kn[i], F.kn[j], t),
  };
}
const inRange = (s, a, b) => { const u = ((s / TRACK_LEN) % 1 + 1) % 1; return u >= a && u <= b; };
const BOOST_ZONES = [[0.52, 0.555], [0.93, 0.96]];
const isBoost = (s) => BOOST_ZONES.some(([a, b]) => inRange(s, a, b));

// ================= 3Dシーン =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ed4f7);
scene.fog = new THREE.Fog(0x9fd8ef, 90, 380);

const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ canvas: $("cv"), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x4f9a4f, 1.0));
const sun = new THREE.DirectionalLight(0xfff4d6, 1.6);
sun.position.set(80, 140, 40);
scene.add(sun);

// ---- 地面 ----
{
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(700, 48),
    new THREE.MeshLambertMaterial({ color: 0x5fb55f }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.08;
  scene.add(ground);
}

// ---- 道路リボン(頂点カラー) ----
function buildRibbon(halfWFrom, halfWTo, colorFn, y) {
  const pos = [], col = [], idx = [];
  for (let i = 0; i <= SAMP; i++) {
    const k = i % SAMP;
    const c = new THREE.Color(colorFn(k));
    pos.push(F.px[k] + F.nx[k] * halfWFrom, y, F.pz[k] + F.nz[k] * halfWFrom);
    pos.push(F.px[k] + F.nx[k] * halfWTo, y, F.pz[k] + F.nz[k] * halfWTo);
    col.push(c.r, c.g, c.b, c.r, c.g, c.b);
    if (i < SAMP) {
      const a = i * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
}
// 道路本体(縞模様+ブーストゾーン)
scene.add(buildRibbon(-HALF_ROAD, HALF_ROAD, (i) => {
  const s = (i / SAMP) * TRACK_LEN;
  if (isBoost(s)) return (i >> 3) % 2 ? 0xff9100 : 0xffb74d;
  return (i >> 4) % 2 ? 0x5e5e66 : 0x55555c;
}, 0.0));
// 縁石(赤白)
scene.add(buildRibbon(HALF_ROAD, HALF_ROAD + 0.9, (i) => (i >> 3) % 2 ? 0xe53935 : 0xfafafa, 0.01));
scene.add(buildRibbon(-HALF_ROAD - 0.9, -HALF_ROAD, (i) => (i >> 3) % 2 ? 0xfafafa : 0xe53935, 0.01));
// センターライン(白の破線)
scene.add(buildRibbon(-0.18, 0.18, (i) => (i >> 2) % 2 ? 0xffffff : 0x55555c, 0.012));

// ---- スタートライン(チェッカー) ----
{
  const pos = [], col = [], idx = [];
  const COLS = 8, ROWS = 2;
  let vi = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const s0 = r * 1.4, s1 = (r + 1) * 1.4;
      const f0 = frameAt(s0), f1 = frameAt(s1);
      const w0 = lerp(-HALF_ROAD, HALF_ROAD, c / COLS), w1 = lerp(-HALF_ROAD, HALF_ROAD, (c + 1) / COLS);
      const color = new THREE.Color((r + c) % 2 ? 0x111111 : 0xffffff);
      const verts = [
        [f0.px + f0.nx * w0, f0.pz + f0.nz * w0],
        [f0.px + f0.nx * w1, f0.pz + f0.nz * w1],
        [f1.px + f1.nx * w0, f1.pz + f1.nz * w0],
        [f1.px + f1.nx * w1, f1.pz + f1.nz * w1],
      ];
      for (const [x, z] of verts) { pos.push(x, 0.02, z); col.push(color.r, color.g, color.b); }
      idx.push(vi, vi + 1, vi + 2, vi + 1, vi + 3, vi + 2);
      vi += 4;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true })));
}

// ---- ゴールゲート ----
{
  const mat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
  const f = frameAt(0.7);
  const mk = (off) => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 7, 8), mat);
    pole.position.set(f.px + f.nx * off, 3.5, f.pz + f.nz * off);
    scene.add(pole);
  };
  mk(HALF_ROAD + 1.3); mk(-HALF_ROAD - 1.3);
  const banner = new THREE.Mesh(
    new THREE.BoxGeometry(HALF_ROAD * 2 + 2.6, 1.2, 0.2),
    new THREE.MeshLambertMaterial({ color: 0xe53935 }));
  banner.position.set(f.px, 6.5, f.pz);
  banner.rotation.y = Math.atan2(f.tx, f.tz);
  scene.add(banner);
  const flag = makeSprite("🏁", 3.2);
  flag.position.set(f.px, 8.6, f.pz);
  scene.add(flag);
}

// ---- 木(インスタンス描画) ----
{
  const NTREE = 140;
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.35, 1.6, 6);
  const leafGeo = new THREE.ConeGeometry(1.7, 3.6, 8);
  const trunk = new THREE.InstancedMesh(trunkGeo, new THREE.MeshLambertMaterial({ color: 0x8d6e63 }), NTREE);
  const leaf = new THREE.InstancedMesh(leafGeo, new THREE.MeshLambertMaterial({ color: 0x2e7d32 }), NTREE);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  let placed = 0, tries = 0;
  while (placed < NTREE && tries < 2000) {
    tries++;
    const s = Math.random() * TRACK_LEN;
    const side = Math.random() < 0.5 ? -1 : 1;
    const off = side * (HALF_ROAD + 4 + Math.random() * 18);
    const f = frameAt(s);
    const x = f.px + f.nx * off, z = f.pz + f.nz * off;
    // 他の道路部分と近すぎないか軽くチェック
    let ok = true;
    for (let k = 0; k < SAMP; k += 25) {
      if ((F.px[k] - x) ** 2 + (F.pz[k] - z) ** 2 < (HALF_ROAD + 2.5) ** 2) { ok = false; break; }
    }
    if (!ok) continue;
    const sc = 0.8 + Math.random() * 1.1;
    m.compose(new THREE.Vector3(x, 0.8 * sc, z), q, new THREE.Vector3(sc, sc, sc));
    trunk.setMatrixAt(placed, m);
    m.compose(new THREE.Vector3(x, (1.6 + 1.6) * sc, z), q, new THREE.Vector3(sc, sc, sc));
    leaf.setMatrixAt(placed, m);
    placed++;
  }
  trunk.count = placed; leaf.count = placed;
  trunk.instanceMatrix.needsUpdate = true;
  leaf.instanceMatrix.needsUpdate = true;
  scene.add(trunk, leaf);
}

// ---- 遠くの山と雲 ----
{
  const mmat = new THREE.MeshLambertMaterial({ color: 0x7fae8a });
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    const r = 280 + (i % 3) * 60;
    const h = 60 + (i * 37 % 50);
    const mt = new THREE.Mesh(new THREE.ConeGeometry(h * 0.9, h, 7), mmat);
    mt.position.set(Math.cos(a) * r, h / 2 - 4, Math.sin(a) * r + 100);
    scene.add(mt);
  }
  for (let i = 0; i < 12; i++) {
    const cl = makeSprite("☁️", 26 + (i % 4) * 8);
    const a = (i / 12) * Math.PI * 2;
    cl.position.set(Math.cos(a) * (140 + i * 12), 55 + (i % 5) * 9, Math.sin(a) * (140 + i * 10) + 100);
    scene.add(cl);
  }
}

// ================= カートのモデル =================
function buildKart(bodyColor, faceEmoji) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.7, 0.55, 2.6),
    new THREE.MeshLambertMaterial({ color: bodyColor }));
  body.position.y = 0.62;
  g.add(body);
  const nose = new THREE.Mesh(
    new THREE.BoxGeometry(1.0, 0.35, 0.8),
    new THREE.MeshLambertMaterial({ color: 0x333333 }));
  nose.position.set(0, 0.55, 1.55);
  g.add(nose);
  const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.34, 12);
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
  for (const [wx, wz] of [[-0.95, 0.95], [0.95, 0.95], [-0.95, -0.95], [0.95, -0.95]]) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(wx, 0.38, wz);
    g.add(w);
  }
  const face = makeSprite(faceEmoji, 1.7);
  face.position.y = 1.85;
  g.add(face);
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.5, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28 }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.03;
  g.add(shadow);
  g.userData.body = body;
  scene.add(g);
  return g;
}

// ================= レーサー定義 =================
const PLAYER_CHARS = [
  { emoji: "🏎️", name: "レーサー", color: 0xe53935 },
  { emoji: "🚗", name: "クルマくん", color: 0x1e88e5 },
  { emoji: "🏍️", name: "バイカー", color: 0x222222 },
  { emoji: "🛻", name: "トラックさん", color: 0x00897b },
];
let playerCharIdx = 0;

const NPC_DEFS = [
  { emoji: "🚓", name: "パトカー", skill: 0.99, color: 0x263238 },
  { emoji: "🚕", name: "タクシー", skill: 0.97, color: 0xfdd835 },
  { emoji: "🚐", name: "バンちゃん", skill: 0.95, color: 0x90a4ae },
  { emoji: "🛵", name: "スクーター", skill: 0.92, color: 0xec407a },
  { emoji: "🚜", name: "トラクター", skill: 0.89, color: 0x7cb342 },
];

const MAX_SPEED = 38;     // m/s
const ACCEL = 16;
const TOTAL_LAPS = 3;
const LANE = 3.2;

let player, npcs, bananas, shells, itemBoxes;
let playerKart = null;
let boostFlame = null;
let raceState = "title";
let raceTime = 0, countdownT = 0;
let finalRanking = null;

// ---- アイテムボックス(3D) ----
const boxTex = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 128, 128);
  grad.addColorStop(0, "#ffd54f");
  grad.addColorStop(0.5, "#ff8a65");
  grad.addColorStop(1, "#7e57c2");
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  g.fillStyle = "#fff";
  g.font = "bold 84px sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText("?", 64, 70);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
function makeItemBoxes() {
  const rows = [0.15, 0.45, 0.78];
  const boxes = [];
  for (const fr of rows) {
    for (const off of [-LANE, 0, LANE]) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 1.5, 1.5),
        new THREE.MeshLambertMaterial({ map: boxTex, transparent: true, opacity: 0.92 }));
      const f = frameAt(fr * TRACK_LEN);
      mesh.position.set(f.px + f.nx * off, 1.1, f.pz + f.nz * off);
      scene.add(mesh);
      boxes.push({ s: fr * TRACK_LEN, off, respawn: 0, mesh });
    }
  }
  return boxes;
}

function clearWorldItems() {
  if (itemBoxes) for (const b of itemBoxes) scene.remove(b.mesh);
  if (bananas) for (const b of bananas) scene.remove(b.sprite);
  if (shells) for (const s of shells) scene.remove(s.sprite);
  if (npcs) for (const n of npcs) scene.remove(n.kart);
  if (playerKart) { scene.remove(playerKart); playerKart = null; }
}

function resetRace() {
  clearWorldItems();
  const ch = PLAYER_CHARS[playerCharIdx];
  player = {
    s: 0, off: 0, speed: 0,
    lap: 1, lapsDone: 0,
    boostT: 0, spinT: 0, padCd: 0, spinAngle: 0,
    item: null, char: ch,
  };
  playerKart = buildKart(ch.color, ch.emoji);
  boostFlame = makeSprite("🔥", 1.6);
  boostFlame.position.set(0, 0.8, -1.9);
  boostFlame.visible = false;
  playerKart.add(boostFlame);

  npcs = NPC_DEFS.map((d, i) => ({
    ...d,
    s: (i + 1) * 9,
    startZ: (i + 1) * 9,
    traveled: 0,
    off: (i % 2 ? LANE : -LANE) * 0.9,
    laneTarget: (i % 2 ? LANE : -LANE) * 0.9,
    speed: 0, spinT: 0, boostT: 0, spinAngle: 0,
    kart: buildKart(d.color, d.emoji),
  }));
  bananas = [];
  shells = [];
  itemBoxes = makeItemBoxes();
  raceTime = 0;
  finalRanking = null;
  updateItemBtn();
}

const playerProgress = () => player.lapsDone * TRACK_LEN + player.s;
const npcProgress = (n) => n.startZ + n.traveled;
function ranking() {
  const all = [
    { name: player.char.name, emoji: player.char.emoji, prog: playerProgress(), isPlayer: true },
    ...npcs.map((n) => ({ name: n.name, emoji: n.emoji, prog: npcProgress(n), isPlayer: false })),
  ];
  all.sort((a, b) => b.prog - a.prog);
  return all;
}
const playerRank = () => ranking().findIndex((r) => r.isPlayer) + 1;

// ================= サウンド =================
let actx = null, engineOsc = null, engineGain = null;
function initAudio() {
  if (actx) { actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = actx.createOscillator();
    engineOsc.type = "sawtooth";
    engineGain = actx.createGain();
    engineGain.gain.value = 0;
    engineOsc.connect(engineGain).connect(actx.destination);
    engineOsc.start();
  } catch (e) { actx = null; }
}
function beep(freq, dur = 0.12, vol = 0.15, type = "square") {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g).connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

// ================= 入力 =================
const input = { left: false, right: false };
function bindHold(el, key) {
  const on = (e) => { input[key] = true; e.preventDefault(); };
  const off = (e) => { input[key] = false; e.preventDefault(); };
  el.addEventListener("touchstart", on, { passive: false });
  el.addEventListener("touchend", off, { passive: false });
  el.addEventListener("touchcancel", off, { passive: false });
  el.addEventListener("mousedown", on);
  el.addEventListener("mouseup", off);
  el.addEventListener("mouseleave", off);
}
bindHold($("btnL"), "left");
bindHold($("btnR"), "right");
$("btnItem").addEventListener("touchstart", (e) => { useItem(); e.preventDefault(); }, { passive: false });
$("btnItem").addEventListener("mousedown", () => useItem());
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") input.left = true;
  if (e.key === "ArrowRight") input.right = true;
  if (e.key === " ") useItem();
});
window.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft") input.left = false;
  if (e.key === "ArrowRight") input.right = false;
});

// ================= アイテム =================
const ITEM_EMOJI = { mushroom: "🍄", banana: "🍌", shell: "🐢" };
function updateItemBtn() {
  $("btnItem").textContent = player && player.item ? ITEM_EMOJI[player.item] : "·";
}
const wrapS = (s) => ((s % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
function useItem() {
  if (raceState !== "race" || !player.item) return;
  const item = player.item;
  player.item = null;
  updateItemBtn();
  if (item === "mushroom") {
    player.boostT = Math.max(player.boostT, 1.6);
    beep(880, 0.25, 0.2, "sawtooth");
  } else if (item === "banana") {
    const sprite = makeSprite("🍌", 1.3);
    const b = { s: wrapS(player.s - 7), off: clamp(player.off, -HALF_ROAD + 1, HALF_ROAD - 1), sprite };
    const f = frameAt(b.s);
    sprite.position.set(f.px + f.nx * b.off, 0.6, f.pz + f.nz * b.off);
    scene.add(sprite);
    bananas.push(b);
    beep(300, 0.15);
  } else if (item === "shell") {
    const sprite = makeSprite("🐢", 1.4);
    const s = { s: wrapS(player.s + 6), off: clamp(player.off, -HALF_ROAD + 1, HALF_ROAD - 1), life: 4, sprite };
    scene.add(sprite);
    shells.push(s);
    beep(600, 0.2, 0.18, "triangle");
  }
}

// ================= 更新 =================
function relS(s) { return wrapS(s - player.s); }

function update(dt) {
  if (raceState === "countdown") {
    countdownT -= dt;
    const n = Math.ceil(countdownT);
    const msg = $("hudMsg");
    if (countdownT <= 0) {
      raceState = "race";
      msg.textContent = "GO!";
      beep(880, 0.4, 0.25);
      setTimeout(() => { if (raceState === "race") msg.textContent = ""; }, 800);
    } else if (msg.dataset.n !== "" + n) {
      msg.dataset.n = "" + n;
      msg.textContent = n;
      beep(440, 0.15, 0.2);
    }
  }
  if (raceState !== "race" && raceState !== "finished") return;

  raceTime += dt;
  updatePlayer(dt);
  updateNpcs(dt);
  updateShells(dt);
  updateHud();
}

function updatePlayer(dt) {
  const p = player;
  const f = frameAt(p.s);
  const sp = p.speed / MAX_SPEED;

  p.boostT = Math.max(0, p.boostT - dt);
  p.spinT = Math.max(0, p.spinT - dt);
  p.padCd = Math.max(0, p.padCd - dt);

  const offroad = Math.abs(p.off) > HALF_ROAD - 0.7;
  let targetMax = MAX_SPEED;
  if (p.boostT > 0) targetMax *= 1.45;
  if (offroad) targetMax *= 0.4;
  if (p.spinT > 0) targetMax *= 0.3;
  if (raceState === "finished") targetMax = MAX_SPEED * 0.3;

  if (p.speed < targetMax) p.speed = Math.min(targetMax, p.speed + ACCEL * (p.boostT > 0 ? 2.2 : 1) * dt);
  else p.speed = Math.max(targetMax, p.speed - ACCEL * 1.8 * dt);

  if (p.spinT <= 0 && raceState === "race") {
    const steer = (input.left ? 1 : 0) + (input.right ? -1 : 0); // 法線は左向きなので右= -
    p.off += steer * 10.5 * sp * dt;
  }
  // 遠心力(外側へ押される。強さは上限つき)
  const push = clamp(-f.kn * p.speed * p.speed * 0.4, -sp * 9.3, sp * 9.3);
  p.off += push * dt;
  p.off = clamp(p.off, -13, 13);

  // ブーストパッド
  if (isBoost(p.s) && Math.abs(p.off) < HALF_ROAD && p.padCd <= 0) {
    p.boostT = Math.max(p.boostT, 0.9);
    p.padCd = 1;
    beep(700, 0.2, 0.15, "sawtooth");
  }

  // 前進・ラップ
  p.s += p.speed * dt;
  if (p.s >= TRACK_LEN) {
    p.s -= TRACK_LEN;
    p.lapsDone++;
    if (raceState === "race") {
      if (p.lapsDone >= TOTAL_LAPS) {
        finishRace();
      } else {
        p.lap = p.lapsDone + 1;
        $("hudMsg").textContent = `LAP ${p.lap}!`;
        beep(660, 0.2, 0.18);
        setTimeout(() => { if (raceState === "race") $("hudMsg").textContent = ""; }, 1000);
      }
    }
  }

  // ライバルとの接触
  for (const n of npcs) {
    const d = relS(n.s);
    const ahead = d < 4.5, behind = d > TRACK_LEN - 4.5;
    if ((ahead || behind) && Math.abs(n.off - p.off) < 1.7) {
      if (ahead && p.speed > n.speed) {
        p.speed = n.speed * 0.85;
        p.off += (p.off >= n.off ? 1 : -1) * 0.5;
        beep(150, 0.08, 0.1);
      } else if (behind && n.speed > p.speed) {
        n.speed = p.speed * 0.85;
      }
    }
  }

  // バナナ
  for (let i = bananas.length - 1; i >= 0; i--) {
    const b = bananas[i];
    if (relS(b.s) < 3 && Math.abs(b.off - p.off) < 1.4 && p.spinT <= 0) {
      p.spinT = 1.1;
      p.speed *= 0.35;
      scene.remove(b.sprite);
      bananas.splice(i, 1);
      beep(200, 0.3, 0.2);
    }
  }

  // アイテムボックス
  for (const box of itemBoxes) {
    box.respawn = Math.max(0, box.respawn - dt);
    box.mesh.visible = box.respawn <= 0;
    if (box.respawn <= 0 && relS(box.s) < 3.5 && Math.abs(box.off - p.off) < 1.8) {
      box.respawn = 5;
      if (!p.item) {
        p.item = randOf(["mushroom", "banana", "shell", "mushroom"]);
        updateItemBtn();
        beep(520, 0.1, 0.15); setTimeout(() => beep(780, 0.12, 0.15), 90);
      }
    }
  }

  if (engineGain) {
    engineOsc.frequency.value = 55 + sp * 160 + (p.boostT > 0 ? 60 : 0);
    engineGain.gain.value = raceState === "race" ? 0.025 : 0.012;
  }
}

function updateNpcs(dt) {
  const pProg = playerProgress();
  for (const n of npcs) {
    n.spinT = Math.max(0, n.spinT - dt);
    n.boostT = Math.max(0, n.boostT - dt);
    if (n.boostT <= 0 && Math.random() < dt * 0.06) n.boostT = 1.3;
    const f = frameAt(n.s);

    let target = MAX_SPEED * n.skill * (1 - Math.min(0.3, Math.abs(f.kn) * 28));
    const gap = (pProg - npcProgress(n)) / TRACK_LEN;
    target *= clamp(1 + gap * 0.2, 0.93, 1.1);
    if (n.spinT > 0) target *= 0.25;
    if (n.boostT > 0) target *= 1.25;
    if (isBoost(n.s) && Math.abs(n.off) < HALF_ROAD) target *= 1.2;

    if (n.speed < target) n.speed = Math.min(target, n.speed + ACCEL * dt);
    else n.speed = Math.max(target, n.speed - ACCEL * 1.5 * dt);

    if (Math.random() < dt * 0.25) n.laneTarget = (Math.random() * 2 - 1) * LANE;
    for (const m of npcs) {
      if (m === n) continue;
      const d = wrapS(m.s - n.s);
      if (d > 0 && d < 12 && Math.abs(m.off - n.off) < 1.8)
        n.laneTarget = m.off > 0 ? m.off - 3 : m.off + 3;
    }
    n.off += clamp(n.laneTarget - n.off, -1, 1) * dt * 4;
    n.off = clamp(n.off, -HALF_ROAD + 1, HALF_ROAD - 1);

    const dz = n.speed * dt;
    n.s = wrapS(n.s + dz);
    n.traveled += dz;

    for (let i = bananas.length - 1; i >= 0; i--) {
      const b = bananas[i];
      const d = wrapS(b.s - n.s);
      if ((d < 3 || d > TRACK_LEN - 3) && Math.abs(b.off - n.off) < 1.4 && n.spinT <= 0) {
        n.spinT = 1.2;
        n.speed *= 0.3;
        scene.remove(b.sprite);
        bananas.splice(i, 1);
      }
    }
  }
}

function updateShells(dt) {
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.life -= dt;
    if (s.life <= 0) { scene.remove(s.sprite); shells.splice(i, 1); continue; }
    let best = null, bestD = 90;
    for (const n of npcs) {
      const d = wrapS(n.s - s.s);
      if (d < bestD) { bestD = d; best = n; }
    }
    if (best) s.off += clamp(best.off - s.off, -1, 1) * dt * 10;
    s.s = wrapS(s.s + MAX_SPEED * 1.55 * dt);
    if (best && bestD < 4 && Math.abs(best.off - s.off) < 1.7) {
      best.spinT = 1.4;
      best.speed *= 0.2;
      scene.remove(s.sprite);
      shells.splice(i, 1);
      beep(180, 0.3, 0.22);
    }
  }
}

function finishRace() {
  raceState = "finished";
  finalRanking = ranking();
  const place = finalRanking.findIndex((r) => r.isPlayer) + 1;
  const medal = place === 1 ? "🏆" : place === 2 ? "🥈" : place === 3 ? "🥉" : "🎌";
  $("resultPlace").textContent = `${medal} ${place}位!`;
  $("resultList").innerHTML = finalRanking
    .map((r, i) => `${i + 1}位 ${r.emoji} ${r.name}${r.isPlayer ? " ←あなた" : ""}`)
    .join("<br>");
  $("hudMsg").textContent = "";
  beep(523, 0.15, 0.2); setTimeout(() => beep(659, 0.15, 0.2), 150); setTimeout(() => beep(784, 0.3, 0.2), 300);
  setTimeout(() => $("resultOv").classList.add("show"), 1400);
}

function updateHud() {
  $("hudLap").textContent = `LAP ${Math.min(player.lap, TOTAL_LAPS)}/${TOTAL_LAPS}`;
  $("hudRank").textContent = `${playerRank()}位`;
  const t = raceTime;
  $("hudTime").textContent = `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}.${Math.floor((t % 1) * 10)}`;
  $("hudSpeed").textContent = `${Math.round(player.speed * 3.6)} km/h`;
}

// ================= 3D配置の反映 =================
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();
let camInit = false;

function placeKart(group, s, off, spinT, steerTilt) {
  const f = frameAt(s);
  group.position.set(f.px + f.nx * off, 0, f.pz + f.nz * off);
  let yaw = Math.atan2(f.tx, f.tz);
  if (spinT > 0) yaw += spinT * 12;
  group.rotation.y = yaw;
  if (group.userData.body) group.userData.body.rotation.z = steerTilt || 0;
}

function syncScene(dt) {
  if (!player) return;
  const p = player;
  const steer = (input.left ? 1 : 0) + (input.right ? -1 : 0);
  placeKart(playerKart, p.s, p.off, p.spinT, -steer * 0.13 * (p.speed / MAX_SPEED));
  boostFlame.visible = p.boostT > 0;
  for (const n of npcs) placeKart(n.kart, n.s, n.off, n.spinT, 0);

  for (const box of itemBoxes) {
    box.mesh.rotation.y += dt * 1.6;
    box.mesh.rotation.x += dt * 0.9;
  }
  for (const b of bananas) {
    const f = frameAt(b.s);
    b.sprite.position.set(f.px + f.nx * b.off, 0.6, f.pz + f.nz * b.off);
  }
  for (const s of shells) {
    const f = frameAt(s.s);
    s.sprite.position.set(f.px + f.nx * s.off, 0.7, f.pz + f.nz * s.off);
    s.sprite.material.rotation += dt * 12;
  }

  // カメラ(プレイヤーの後ろから追従)
  const f = frameAt(p.s);
  const px = f.px + f.nx * p.off, pz = f.pz + f.nz * p.off;
  camPos.set(px - f.tx * 8.5, 4.0, pz - f.tz * 8.5);
  camTarget.set(px + f.tx * 9, 1.4, pz + f.tz * 9);
  if (!camInit) {
    camera.position.copy(camPos);
    camInit = true;
  } else {
    camera.position.lerp(camPos, 1 - Math.pow(0.0008, dt));
  }
  camera.lookAt(camTarget);
}

// ================= メインループ =================
let lastT = performance.now();
function loop(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.05);
  update(dt);
  if (player) syncScene(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ================= 画面遷移 =================
function buildCharRow() {
  const row = $("charRow");
  row.innerHTML = "";
  PLAYER_CHARS.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "charBtn" + (i === playerCharIdx ? " sel" : "");
    b.textContent = c.emoji;
    b.addEventListener("click", () => { playerCharIdx = i; buildCharRow(); });
    row.appendChild(b);
  });
}
buildCharRow();

function startRace() {
  initAudio();
  resetRace();
  camInit = false;
  $("titleOv").classList.remove("show");
  $("resultOv").classList.remove("show");
  $("hudMsg").dataset.n = "";
  raceState = "countdown";
  countdownT = 3;
}
$("startBtn").addEventListener("click", startRace);
$("retryBtn").addEventListener("click", () => {
  $("resultOv").classList.remove("show");
  $("titleOv").classList.add("show");
  raceState = "title";
  if (engineGain) engineGain.gain.value = 0;
});

document.addEventListener("visibilitychange", () => { lastT = performance.now(); });

// タイトル裏でもコースを見せる(デモカメラ)
resetRace();
raceState = "title";

window.__kartBooted = true;
requestAnimationFrame(loop);
</script>
