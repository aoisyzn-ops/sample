<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えもじカート</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; width: 100%; height: 100%; max-width: 560px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---- HUD ---- */
  .hud { position: absolute; color: #fff; font-weight: bold; text-shadow: 0 2px 3px rgba(0,0,0,0.6); z-index: 5; pointer-events: none; }
  #hudLap   { top: 10px; left: 12px; font-size: 20px; }
  #hudRank  { top: 6px; right: 12px; font-size: 30px; }
  #hudTime  { top: 40px; left: 12px; font-size: 14px; opacity: 0.9; }
  #hudSpeed { top: 44px; right: 12px; font-size: 15px; }
  #hudMsg {
    top: 26%; left: 0; right: 0;
    text-align: center; font-size: 52px;
    text-shadow: 0 4px 8px rgba(0,0,0,0.5);
  }

  /* ---- 操作ボタン ---- */
  .ctl {
    position: absolute; bottom: 18px;
    width: 84px; height: 84px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.25);
    color: #fff; font-size: 34px;
    z-index: 6;
    backdrop-filter: blur(2px);
  }
  .ctl:active { background: rgba(255,255,255,0.5); }
  #btnL { left: 14px; }
  #btnR { right: 14px; }
  #btnItem {
    right: 14px; bottom: 118px;
    background: rgba(255,215,0,0.35);
    border: 3px solid rgba(255,255,255,0.6);
    font-size: 38px;
  }

  /* ---- オーバーレイ(タイトル/リザルト) ---- */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(20, 30, 60, 0.88);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    z-index: 10;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 36px; text-shadow: 0 3px 0 rgba(0,0,0,0.4); }
  .overlay .sub { font-size: 14px; opacity: 0.85; }
  #charRow { display: flex; gap: 12px; }
  .charBtn {
    font-size: 40px;
    width: 70px; height: 70px;
    border-radius: 16px;
    border: 3px solid transparent;
    background: rgba(255,255,255,0.15);
  }
  .charBtn.sel { border-color: #ffd700; background: rgba(255,215,0,0.25); }
  .bigBtn {
    font-size: 22px; font-weight: bold;
    padding: 14px 48px;
    border: none; border-radius: 999px;
    background: #ff5252; color: #fff;
    box-shadow: 0 5px 0 #b73838;
  }
  .bigBtn:active { transform: translateY(3px); box-shadow: none; }
  #resultList {
    font-size: 18px; line-height: 1.9;
    background: rgba(0,0,0,0.3);
    border-radius: 14px;
    padding: 12px 28px;
    text-align: left;
  }
  #resultPlace { font-size: 44px; }
  .help { font-size: 13px; opacity: 0.8; line-height: 1.7; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div class="hud" id="hudLap">LAP 1/3</div>
  <div class="hud" id="hudRank">6位</div>
  <div class="hud" id="hudTime">0:00.0</div>
  <div class="hud" id="hudSpeed">0 km/h</div>
  <div class="hud" id="hudMsg"></div>

  <button class="ctl" id="btnL">◀</button>
  <button class="ctl" id="btnR">▶</button>
  <button class="ctl" id="btnItem">·</button>

  <!-- タイトル -->
  <div class="overlay show" id="titleOv">
    <h1>🏁 えもじカート</h1>
    <div class="sub">マシンをえらんでね</div>
    <div id="charRow"></div>
    <button class="bigBtn" id="startBtn">スタート!</button>
    <div class="help">
      ◀ ▶ でハンドル(アクセルは自動)<br>
      ❓ボックスを取るとアイテムゲット!<br>
      右下のボタンでアイテムを使う<br>
      🍄ダッシュ 🍌うしろに設置 🐢前に発射<br>
      3周してゴールをめざせ!
    </div>
  </div>

  <!-- リザルト -->
  <div class="overlay" id="resultOv">
    <h1>🏁 ゴール!</h1>
    <div id="resultPlace"></div>
    <div id="resultList"></div>
    <button class="bigBtn" id="retryBtn">もう一回</button>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const randOf = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ================= 画面 =================
const cv = $("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth;
  H = cv.clientHeight;
  cv.width = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

// ================= 絵文字スプライト =================
const spriteCache = {};
function emojiSprite(emoji, size = 128) {
  if (spriteCache[emoji]) return spriteCache[emoji];
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.font = `${size * 0.82}px serif`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(emoji, size / 2, size / 2 + size * 0.05);
  spriteCache[emoji] = c;
  return c;
}
// ❓アイテムボックス(描き起こし)
const boxSprite = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 128, 128);
  grad.addColorStop(0, "#ffd54f");
  grad.addColorStop(0.5, "#ff8a65");
  grad.addColorStop(1, "#7e57c2");
  g.fillStyle = grad;
  g.strokeStyle = "#fff";
  g.lineWidth = 8;
  roundRect(g, 14, 14, 100, 100, 18);
  g.fill(); g.stroke();
  g.fillStyle = "#fff";
  g.font = "bold 70px sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText("?", 64, 68);
  return c;
})();
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// ================= コース =================
const SEG_LEN = 200;
const ROAD_W = 2300;            // 道路の半分の幅
const CAM_H = 3600;
const CAM_DEPTH = 1 / Math.tan((100 / 2) * Math.PI / 180);
const DRAW_DIST = 70;

const segments = [];
function addSegs(count, curveFrom, curveTo) {
  for (let i = 0; i < count; i++) {
    segments.push({
      index: segments.length,
      curve: lerp(curveFrom, curveTo, count <= 1 ? 1 : i / (count - 1)),
      boost: false,
      decos: [],
      scr: null, scrFrame: -1,
    });
  }
}
function addCurve(enter, hold, leave, curve) {
  addSegs(enter, 0, curve);
  addSegs(hold, curve, curve);
  addSegs(leave, curve, 0);
}
// ---- コースレイアウト(1周分) ----
addSegs(60, 0, 0);            // スタート直線
addCurve(15, 35, 15, 3);      // ゆるい右
addSegs(25, 0, 0);
addCurve(12, 30, 12, -4);     // 左カーブ
addSegs(20, 0, 0);
addCurve(10, 22, 10, 4);      // S字 右
addCurve(10, 22, 10, -4);     // S字 左
addSegs(50, 0, 0);            // ブーストゾーンつき直線
addCurve(18, 40, 18, 5.2);    // ヘアピン右
addSegs(35, 0, 0);
addCurve(15, 35, 15, -2.5);   // ゆるい左
addSegs(40, 0, 0);            // 最終直線
const N = segments.length;
const TRACK_LEN = N * SEG_LEN;

// ブーストパッド
for (let i = 0; i < N; i++) {
  const s = segments[i];
  if ((i >= 318 && i <= 326) || (i >= 545 && i <= 551 && i < N)) s.boost = true;
}
// まわりの飾り
const DECOS = ["🌴", "🌳", "🌲", "⛰️", "🌻", "🍄"];
for (let i = 4; i < N; i += 6) {
  const side = (i % 12 < 6) ? -1 : 1;
  segments[i].decos.push({
    img: emojiSprite(DECOS[(i / 6 | 0) % DECOS.length]),
    offset: side * (1.7 + (i * 7 % 10) / 10),
    w: 900 + (i * 13 % 600),
  });
}
// ゴールの旗
segments[2].decos.push({ img: emojiSprite("🏁"), offset: -1.45, w: 1100 });
segments[2].decos.push({ img: emojiSprite("🏁"), offset: 1.45, w: 1100 });

const segAt = (z) => segments[Math.floor(((z % TRACK_LEN) + TRACK_LEN) % TRACK_LEN / SEG_LEN) % N];

// ================= レーサー =================
const PLAYER_CHARS = [
  { emoji: "🏎️", name: "レーサー" },
  { emoji: "🚗", name: "クルマくん" },
  { emoji: "🏍️", name: "バイカー" },
  { emoji: "🛻", name: "トラックさん" },
];
let playerCharIdx = 0;

const NPC_DEFS = [
  { emoji: "🚓", name: "パトカー", skill: 0.99 },
  { emoji: "🚕", name: "タクシー", skill: 0.97 },
  { emoji: "🚐", name: "バンちゃん", skill: 0.95 },
  { emoji: "🛵", name: "スクーター", skill: 0.92 },
  { emoji: "🚜", name: "トラクター", skill: 0.89 },
];

const MAX_SPEED = 12000;       // 単位/秒
const ACCEL = 5200;
const TOTAL_LAPS = 3;

let player, npcs, bananas, shells, itemBoxes;
let raceState = "title";       // title / countdown / race / finished
let raceTime = 0, countdownT = 0, frame = 0;
let bgX = 0;
let finalRanking = null;

function makeItemBoxes() {
  const rows = [85, 250, 445];
  const boxes = [];
  for (const seg of rows)
    for (const off of [-0.55, 0, 0.55])
      boxes.push({ z: seg * SEG_LEN, offset: off, respawn: 0 });
  return boxes;
}

function resetRace() {
  player = {
    z: 0, x: 0, speed: 0,
    lap: 1, lapsDone: 0,
    boostT: 0, spinT: 0, padCd: 0,
    item: null,
    char: PLAYER_CHARS[playerCharIdx],
  };
  npcs = NPC_DEFS.map((d, i) => ({
    ...d,
    z: (i + 1) * 450,
    startZ: (i + 1) * 450,
    traveled: 0,
    offset: (i % 2 ? 0.45 : -0.45),
    laneTarget: (i % 2 ? 0.45 : -0.45),
    speed: 0, spinT: 0, boostT: 0,
    img: emojiSprite(d.emoji),
  }));
  bananas = [];
  shells = [];
  itemBoxes = makeItemBoxes();
  raceTime = 0;
  finalRanking = null;
  updateItemBtn();
}

const playerProgress = () => player.lapsDone * TRACK_LEN + player.z;
const npcProgress = (n) => n.startZ + n.traveled;

function ranking() {
  const all = [
    { name: player.char.name, emoji: player.char.emoji, prog: playerProgress(), isPlayer: true },
    ...npcs.map((n) => ({ name: n.name, emoji: n.emoji, prog: npcProgress(n), isPlayer: false })),
  ];
  all.sort((a, b) => b.prog - a.prog);
  return all;
}
const playerRank = () => ranking().findIndex((r) => r.isPlayer) + 1;

// ================= サウンド =================
let actx = null, engineOsc = null, engineGain = null;
function initAudio() {
  if (actx) { actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = actx.createOscillator();
    engineOsc.type = "sawtooth";
    engineGain = actx.createGain();
    engineGain.gain.value = 0;
    engineOsc.connect(engineGain).connect(actx.destination);
    engineOsc.start();
  } catch (e) { actx = null; }
}
function beep(freq, dur = 0.12, vol = 0.15, type = "square") {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g).connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

// ================= 入力 =================
const input = { left: false, right: false };
function bindHold(el, key) {
  const on = (e) => { input[key] = true; e.preventDefault(); };
  const off = (e) => { input[key] = false; e.preventDefault(); };
  el.addEventListener("touchstart", on, { passive: false });
  el.addEventListener("touchend", off, { passive: false });
  el.addEventListener("touchcancel", off, { passive: false });
  el.addEventListener("mousedown", on);
  el.addEventListener("mouseup", off);
  el.addEventListener("mouseleave", off);
}
bindHold($("btnL"), "left");
bindHold($("btnR"), "right");
$("btnItem").addEventListener("touchstart", (e) => { useItem(); e.preventDefault(); }, { passive: false });
$("btnItem").addEventListener("mousedown", () => useItem());
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") input.left = true;
  if (e.key === "ArrowRight") input.right = true;
  if (e.key === " ") useItem();
});
window.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft") input.left = false;
  if (e.key === "ArrowRight") input.right = false;
});

// ================= アイテム =================
const ITEM_EMOJI = { mushroom: "🍄", banana: "🍌", shell: "🐢" };
function updateItemBtn() {
  $("btnItem").textContent = player && player.item ? ITEM_EMOJI[player.item] : "·";
}
function useItem() {
  if (raceState !== "race" || !player.item) return;
  const item = player.item;
  player.item = null;
  updateItemBtn();
  if (item === "mushroom") {
    player.boostT = Math.max(player.boostT, 1.6);
    beep(880, 0.25, 0.2, "sawtooth");
  } else if (item === "banana") {
    bananas.push({ z: ((player.z - 450) % TRACK_LEN + TRACK_LEN) % TRACK_LEN, offset: clamp(player.x, -1, 1) });
    beep(300, 0.15);
  } else if (item === "shell") {
    shells.push({ z: (player.z + 350) % TRACK_LEN, offset: clamp(player.x, -1, 1), life: 4 });
    beep(600, 0.2, 0.18, "triangle");
  }
}

// ================= 更新 =================
function relZ(z) { // playerから見た前方距離(0..TRACK_LEN)
  return ((z - player.z) % TRACK_LEN + TRACK_LEN) % TRACK_LEN;
}

function update(dt) {
  frame++;
  if (raceState === "countdown") {
    countdownT -= dt;
    const n = Math.ceil(countdownT);
    const msg = $("hudMsg");
    if (countdownT <= 0) {
      raceState = "race";
      msg.textContent = "GO!";
      beep(880, 0.4, 0.25);
      setTimeout(() => { if (raceState === "race") msg.textContent = ""; }, 800);
    } else if (msg.dataset.n !== "" + n) {
      msg.dataset.n = "" + n;
      msg.textContent = n;
      beep(440, 0.15, 0.2);
    }
  }
  if (raceState !== "race" && raceState !== "finished") return;

  raceTime += dt;
  updatePlayer(dt);
  updateNpcs(dt);
  updateShells(dt);
  updateHud();
}

function updatePlayer(dt) {
  const p = player;
  const seg = segAt(p.z);
  const sp = p.speed / MAX_SPEED;

  p.boostT = Math.max(0, p.boostT - dt);
  p.spinT = Math.max(0, p.spinT - dt);
  p.padCd = Math.max(0, p.padCd - dt);

  const offroad = Math.abs(p.x) > 1.06;
  let targetMax = MAX_SPEED;
  if (p.boostT > 0) targetMax *= 1.45;
  if (offroad) targetMax *= 0.4;
  if (p.spinT > 0) targetMax *= 0.3;
  if (raceState === "finished") targetMax = MAX_SPEED * 0.3; // ゴール後は流す

  // 加減速
  if (p.speed < targetMax) p.speed = Math.min(targetMax, p.speed + ACCEL * (p.boostT > 0 ? 2.2 : 1) * dt);
  else p.speed = Math.max(targetMax, p.speed - ACCEL * 1.8 * dt);

  // ハンドル
  if (p.spinT <= 0 && raceState === "race") {
    const steer = (input.left ? -1 : 0) + (input.right ? 1 : 0);
    p.x += steer * 1.9 * sp * dt;
  }
  // カーブの遠心力(強め: カーブはしっかり曲がらないと飛び出す)
  p.x -= seg.curve * sp * 0.33 * dt;
  p.x = clamp(p.x, -2.2, 2.2);

  // ブーストパッド
  if (seg.boost && Math.abs(p.x) < 1 && p.padCd <= 0) {
    p.boostT = Math.max(p.boostT, 0.9);
    p.padCd = 1;
    beep(700, 0.2, 0.15, "sawtooth");
  }

  // 前進・ラップ
  const before = p.z;
  p.z += p.speed * dt;
  if (p.z >= TRACK_LEN) {
    p.z -= TRACK_LEN;
    p.lapsDone++;
    if (raceState === "race") {
      if (p.lapsDone >= TOTAL_LAPS) {
        finishRace();
      } else {
        p.lap = p.lapsDone + 1;
        $("hudMsg").textContent = `LAP ${p.lap}!`;
        beep(660, 0.2, 0.18);
        setTimeout(() => { if (raceState === "race") $("hudMsg").textContent = ""; }, 1000);
      }
    }
  }

  // ライバルとの接触
  for (const n of npcs) {
    const d = relZ(n.z);
    const ahead = d < 260, behind = d > TRACK_LEN - 260;
    if ((ahead || behind) && Math.abs(n.offset - p.x) < 0.3) {
      if (ahead && p.speed > n.speed) {
        p.speed = n.speed * 0.85;
        p.x += (p.x >= n.offset ? 1 : -1) * 0.08;
        beep(150, 0.08, 0.1);
      } else if (behind && n.speed > p.speed) {
        n.speed = p.speed * 0.85;
      }
    }
  }

  // バナナ
  for (let i = bananas.length - 1; i >= 0; i--) {
    const b = bananas[i];
    if (relZ(b.z) < 300 && Math.abs(b.offset - p.x) < 0.26 && p.spinT <= 0) {
      p.spinT = 1.1;
      p.speed *= 0.35;
      bananas.splice(i, 1);
      beep(200, 0.3, 0.2);
    }
  }

  // アイテムボックス
  for (const box of itemBoxes) {
    box.respawn = Math.max(0, box.respawn - dt);
    if (box.respawn <= 0 && relZ(box.z) < 320 && Math.abs(box.offset - p.x) < 0.32) {
      box.respawn = 5;
      if (!p.item) {
        p.item = randOf(["mushroom", "banana", "shell", "mushroom"]);
        updateItemBtn();
        beep(520, 0.1, 0.15); setTimeout(() => beep(780, 0.12, 0.15), 90);
      }
    }
  }

  // エンジン音
  if (engineGain) {
    engineOsc.frequency.value = 55 + sp * 160 + (p.boostT > 0 ? 60 : 0);
    engineGain.gain.value = raceState === "race" ? 0.025 : 0.012;
  }
}

function updateNpcs(dt) {
  const pRank = playerProgress();
  for (const n of npcs) {
    n.spinT = Math.max(0, n.spinT - dt);
    n.boostT = Math.max(0, n.boostT - dt);
    // CPUもたまにダッシュを使う
    if (n.boostT <= 0 && Math.random() < dt * 0.06) n.boostT = 1.3;
    const seg = segAt(n.z);

    let target = MAX_SPEED * n.skill * (1 - Math.min(0.25, Math.abs(seg.curve) * 0.035));
    // ゴムバンド(離されすぎ防止・手加減は控えめ)
    const gap = (pRank - npcProgress(n)) / TRACK_LEN;
    target *= clamp(1 + gap * 0.2, 0.93, 1.1);
    if (n.spinT > 0) target *= 0.25;
    if (n.boostT > 0) target *= 1.25;
    if (seg.boost && Math.abs(n.offset) < 1) target *= 1.2;

    if (n.speed < target) n.speed = Math.min(target, n.speed + ACCEL * dt);
    else n.speed = Math.max(target, n.speed - ACCEL * 1.5 * dt);

    // たまに車線変更
    if (Math.random() < dt * 0.25) n.laneTarget = clamp((Math.random() * 1.4 - 0.7), -0.8, 0.8);
    // 前の車をよける
    for (const m of npcs) {
      if (m === n) continue;
      const d = ((m.z - n.z) % TRACK_LEN + TRACK_LEN) % TRACK_LEN;
      if (d > 0 && d < 700 && Math.abs(m.offset - n.offset) < 0.35)
        n.laneTarget = m.offset > 0 ? m.offset - 0.6 : m.offset + 0.6;
    }
    n.offset += clamp(n.laneTarget - n.offset, -1, 1) * dt * 1.2;
    n.offset = clamp(n.offset, -0.95, 0.95);

    const dz = n.speed * dt;
    n.z = (n.z + dz) % TRACK_LEN;
    n.traveled += dz;

    // NPCもバナナを踏む
    for (let i = bananas.length - 1; i >= 0; i--) {
      const b = bananas[i];
      const d = ((b.z - n.z) % TRACK_LEN + TRACK_LEN) % TRACK_LEN;
      if ((d < 280 || d > TRACK_LEN - 280) && Math.abs(b.offset - n.offset) < 0.26 && n.spinT <= 0) {
        n.spinT = 1.2;
        n.speed *= 0.3;
        bananas.splice(i, 1);
      }
    }
  }
}

function updateShells(dt) {
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i];
    s.life -= dt;
    if (s.life <= 0) { shells.splice(i, 1); continue; }
    // いちばん近い前方のライバルを追尾
    let best = null, bestD = 5000;
    for (const n of npcs) {
      const d = ((n.z - s.z) % TRACK_LEN + TRACK_LEN) % TRACK_LEN;
      if (d < bestD) { bestD = d; best = n; }
    }
    if (best) s.offset += clamp(best.offset - s.offset, -1, 1) * dt * 2.5;
    s.z = (s.z + MAX_SPEED * 1.55 * dt) % TRACK_LEN;
    if (best && bestD < 220 && Math.abs(best.offset - s.offset) < 0.3) {
      best.spinT = 1.4;
      best.speed *= 0.2;
      shells.splice(i, 1);
      beep(180, 0.3, 0.22);
    }
  }
}

function finishRace() {
  raceState = "finished";
  finalRanking = ranking();
  const place = finalRanking.findIndex((r) => r.isPlayer) + 1;
  const medal = place === 1 ? "🏆" : place === 2 ? "🥈" : place === 3 ? "🥉" : "🎌";
  $("resultPlace").textContent = `${medal} ${place}位!`;
  $("resultList").innerHTML = finalRanking
    .map((r, i) => `${i + 1}位 ${r.emoji} ${r.name}${r.isPlayer ? " ←あなた" : ""}`)
    .join("<br>");
  $("hudMsg").textContent = "";
  beep(523, 0.15, 0.2); setTimeout(() => beep(659, 0.15, 0.2), 150); setTimeout(() => beep(784, 0.3, 0.2), 300);
  setTimeout(() => $("resultOv").classList.add("show"), 1400);
}

function updateHud() {
  $("hudLap").textContent = `LAP ${Math.min(player.lap, TOTAL_LAPS)}/${TOTAL_LAPS}`;
  $("hudRank").textContent = `${playerRank()}位`;
  const t = raceTime;
  $("hudTime").textContent = `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}.${Math.floor((t % 1) * 10)}`;
  $("hudSpeed").textContent = `${Math.round(player.speed / MAX_SPEED * 96)} km/h`;
}

// ================= 描画 =================
function project(relX, worldZ, camZ) {
  // relX: カメラから見た道路中心の横位置(ワールド単位)
  const dz = worldZ - camZ;
  const scale = CAM_DEPTH / dz;
  return {
    scale,
    x: W / 2 + scale * relX * (W / 2),
    y: H / 2 + scale * CAM_H * (W / 2),
    w: scale * ROAD_W * (W / 2),
  };
}

function poly(x1, y1, x2, y2, x3, y3, x4, y4, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath();
  ctx.fill();
}

function drawBackground(curveNow, sp, dt) {
  bgX -= curveNow * sp * dt * 60;
  // 空
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  sky.addColorStop(0, "#3aa0ff");
  sky.addColorStop(1, "#bfe6ff");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.6);
  // 太陽
  ctx.fillStyle = "#fff176";
  ctx.beginPath();
  ctx.arc(W * 0.78, H * 0.13, 26, 0, Math.PI * 2);
  ctx.fill();
  // 山(パララックス)
  ctx.fillStyle = "#7cb87c";
  for (let i = -1; i < 6; i++) {
    const mx = ((i * W * 0.45 + bgX * 0.35) % (W * 2.7) + W * 2.7) % (W * 2.7) - W * 0.6;
    ctx.beginPath();
    ctx.arc(mx, H * 0.52, W * 0.3, Math.PI, 0);
    ctx.fill();
  }
  // 雲
  const cl = emojiSprite("☁️");
  for (let i = 0; i < 3; i++) {
    const cx = ((i * W * 0.5 + bgX * 0.15 + raceTime * 6) % (W * 1.6) + W * 1.6) % (W * 1.6) - W * 0.3;
    ctx.drawImage(cl, cx, H * (0.05 + i * 0.06), 70, 70);
  }
}

function render(dt) {
  const p = player;
  const baseSeg = segAt(p.z);
  const basePct = (p.z % SEG_LEN) / SEG_LEN;
  const sp = p.speed / MAX_SPEED;

  drawBackground(baseSeg.curve, sp, dt);
  // 地面ベース
  ctx.fillStyle = "#5cb85c";
  ctx.fillRect(0, H * 0.5, W, H * 0.5);

  const camX = p.x * ROAD_W;
  let x = 0;
  let dx = -(baseSeg.curve * basePct);
  let maxY = H;
  const drawList = [];

  for (let n = 0; n < DRAW_DIST; n++) {
    const i = (baseSeg.index + n) % N;
    const seg = segments[i];
    const looped = i < baseSeg.index;
    const zOff = looped ? TRACK_LEN : 0;
    const z1 = seg.index * SEG_LEN + zOff;
    const z2 = z1 + SEG_LEN;

    const p1 = project(x - camX, z1, p.z);
    const p2 = project(x + dx - camX, z2, p.z);
    x += dx;
    dx += seg.curve;

    seg.scr = { p1, p2 };
    seg.scrFrame = frame;

    if (z1 - p.z < SEG_LEN * 0.8 || p2.y >= maxY) continue;

    const dark = (i >> 2) % 2 === 0;
    // 草
    ctx.fillStyle = dark ? "#4caf50" : "#66bb6a";
    ctx.fillRect(0, p2.y, W, p1.y - p2.y + 1);
    // 縁石
    poly(p1.x - p1.w * 1.14, p1.y, p1.x + p1.w * 1.14, p1.y,
         p2.x + p2.w * 1.14, p2.y, p2.x - p2.w * 1.14, p2.y,
         dark ? "#e53935" : "#fafafa");
    // 道路
    let roadCol = dark ? "#6d6d6d" : "#757575";
    if (seg.boost) roadCol = dark ? "#ff9100" : "#ffab40";
    poly(p1.x - p1.w, p1.y, p1.x + p1.w, p1.y,
         p2.x + p2.w, p2.y, p2.x - p2.w, p2.y, roadCol);
    // センターライン
    if (!seg.boost && dark)
      poly(p1.x - p1.w * 0.012, p1.y, p1.x + p1.w * 0.012, p1.y,
           p2.x + p2.w * 0.012, p2.y, p2.x - p2.w * 0.012, p2.y, "#fdfdfd");
    // ゴールライン(チェッカー)
    if (i === 1) {
      const K = 8;
      for (let k = 0; k < K; k++) {
        const a1 = lerp(p1.x - p1.w, p1.x + p1.w, k / K);
        const a2 = lerp(p1.x - p1.w, p1.x + p1.w, (k + 1) / K);
        const b1 = lerp(p2.x - p2.w, p2.x + p2.w, k / K);
        const b2 = lerp(p2.x - p2.w, p2.x + p2.w, (k + 1) / K);
        poly(a1, p1.y, a2, p1.y, b2, p2.y, b1, p2.y, k % 2 ? "#111" : "#fff");
      }
    }
    maxY = p1.y;
    drawList.push(n);
  }

  // ---- スプライト(奥から手前) ----
  for (let d = drawList.length - 1; d >= 0; d--) {
    const n = drawList[d];
    const i = (baseSeg.index + n) % N;
    const seg = segments[i];
    if (seg.scrFrame !== frame) continue;
    const { p1, p2 } = seg.scr;

    const drawAt = (img, offset, worldW, pct, rot) => {
      const scale = lerp(p1.scale, p2.scale, pct);
      const sx = lerp(p1.x, p2.x, pct) + scale * offset * ROAD_W * (W / 2);
      const sy = lerp(p1.y, p2.y, pct);
      const sw = scale * worldW * (W / 2);
      if (sw < 2) return;
      if (rot) {
        ctx.save();
        ctx.translate(sx, sy - sw / 2);
        ctx.rotate(rot);
        ctx.drawImage(img, -sw / 2, -sw / 2, sw, sw);
        ctx.restore();
      } else {
        ctx.drawImage(img, sx - sw / 2, sy - sw, sw, sw);
      }
    };

    for (const deco of seg.decos) drawAt(deco.img, deco.offset, deco.w, 0, 0);
    for (const box of itemBoxes)
      if (box.respawn <= 0 && segAt(box.z).index === i)
        drawAt(boxSprite, box.offset, 430, (box.z % SEG_LEN) / SEG_LEN, 0);
    for (const b of bananas)
      if (segAt(b.z).index === i)
        drawAt(emojiSprite("🍌"), b.offset, 330, (b.z % SEG_LEN) / SEG_LEN, 0);
    for (const s of shells)
      if (segAt(s.z).index === i)
        drawAt(emojiSprite("🐢"), s.offset, 380, (s.z % SEG_LEN) / SEG_LEN, raceTime * 12);
    for (const npc of npcs)
      if (segAt(npc.z).index === i)
        drawAt(npc.img, npc.offset, 760, (npc.z % SEG_LEN) / SEG_LEN,
               npc.spinT > 0 ? npc.spinT * 12 : 0);
  }

  // ---- 自分のカート ----
  const kart = emojiSprite(p.char.emoji);
  const kw = W * 0.2;
  const bounce = Math.sin(raceTime * 28) * sp * 2;
  const steer = (input.left ? -1 : 0) + (input.right ? 1 : 0);
  let rot = steer * 0.12 * sp;
  if (p.spinT > 0) rot = p.spinT * 11;
  ctx.save();
  ctx.translate(W / 2, H - kw * 0.55 - 36 + bounce);
  ctx.rotate(rot);
  // ブースト炎
  if (p.boostT > 0) {
    ctx.font = `${kw * 0.5}px serif`;
    ctx.textAlign = "center";
    ctx.fillText("🔥", 0, kw * 0.55);
  }
  ctx.drawImage(kart, -kw / 2, -kw / 2, kw, kw);
  ctx.restore();
}

// ================= メインループ =================
let lastT = performance.now();
function loop(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.05);
  if (raceState !== "title") {
    update(dt);
    render(dt);
  }
  requestAnimationFrame(loop);
}

// ================= 画面遷移 =================
function buildCharRow() {
  const row = $("charRow");
  row.innerHTML = "";
  PLAYER_CHARS.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "charBtn" + (i === playerCharIdx ? " sel" : "");
    b.textContent = c.emoji;
    b.addEventListener("click", () => { playerCharIdx = i; buildCharRow(); });
    row.appendChild(b);
  });
}
buildCharRow();

function startRace() {
  initAudio();
  resetRace();
  $("titleOv").classList.remove("show");
  $("resultOv").classList.remove("show");
  $("hudMsg").dataset.n = "";
  raceState = "countdown";
  countdownT = 3;
}
$("startBtn").addEventListener("click", startRace);
$("retryBtn").addEventListener("click", () => {
  $("resultOv").classList.remove("show");
  $("titleOv").classList.add("show");
  raceState = "title";
  if (engineGain) engineGain.gain.value = 0;
});

document.addEventListener("visibilitychange", () => { lastT = performance.now(); });

resize();
requestAnimationFrame(loop);
</script>
